name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.64)"
        required: true
        default: "v1.5.64"

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Desktop App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS App
        run: |
          ./gradlew :desktop:createDistributable --no-daemon

      - name: Package macOS App to Zip
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          (cd desktop/build/compose/binaries/main/app && zip -r -y "$GITHUB_WORKSPACE/release-artifacts/Comics8-mac.zip" Comics8.app)

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifact
          path: release-artifacts/Comics8-mac.zip

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-artifacts/Comics8-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Portable App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Install MinGW (for windres)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Windows Portable Zip
        run: |
          ./gradlew :desktop:packageWindowsZip --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp desktop/build/compose/binaries/main/Comics8-win.zip "$GITHUB_WORKSPACE/release-artifacts/"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-artifact
          path: release-artifacts/Comics8-win.zip

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-artifacts/Comics8-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
