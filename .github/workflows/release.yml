name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.64)"
        required: true
        default: "v1.5.64"

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Desktop App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS App
        run: |
          ./gradlew :desktop:createDistributable --no-daemon

      - name: Package macOS App to Zip
        run: |
          mkdir -p release-artifacts
          (cd desktop/build/compose/binaries/main/app && zip -r -y ../../../../../release-artifacts/Comics8-mac.zip Comics8.app)

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifact
          path: release-artifacts/Comics8-mac.zip

  build-windows:
    name: Build Windows Portable App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Windows Portable Zip
        run: |
          ./gradlew :desktop:packageWindowsZip --no-daemon
          mkdir -p release-artifacts
          cp desktop/build/compose/binaries/main/Comics8-win.zip release-artifacts/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-artifact
          path: release-artifacts/Comics8-win.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Determine Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Comics8 ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/Comics8-mac.zip
            release-files/Comics8-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
